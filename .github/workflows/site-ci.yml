name: 랜딩페이지 검사

on:
  pull_request:
    paths:
      - "site/**"
      - "latest_version.json"
      - "site_updates.json"
      - "mypackage/version.py"
      - "scripts/export_release.py"
      - ".github/workflows/site-ci.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "latest_version.json"
      - "site_updates.json"
      - "mypackage/version.py"
      - "scripts/export_release.py"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: 릴리스 피드 확인
        run: python scripts/export_release.py --check

      - name: Node.js 준비
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 랜딩페이지 의존성 설치
        working-directory: site
        run: npm ci

      - name: 랜딩페이지 빌드 및 검증
        working-directory: site
        run: npm test
